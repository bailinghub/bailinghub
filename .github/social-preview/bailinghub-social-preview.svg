<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">让 Agent 通过对话操作你的业务后台</title>
<desc id="desc">BailingHub 将自然语言请求连接到商城、SaaS、CRM 和 ERP，同时保留可信身份、权限、审批、审计与业务系统最终授权。</desc>
<defs><linearGradient id="social-glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#12261a"/><stop offset="1" stop-color="#0d1117"/></linearGradient><marker id="social-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3fb950"/></marker></defs>
<rect width="1280" height="640" fill="url(#social-glow)"/>
<path d="M 0 0 H 1280 V 8 H 0 Z" fill="#3fb950"/>
<circle cx="1140" cy="78" r="170" fill="#3fb950" opacity="0.05"/>
<circle cx="1120" cy="600" r="260" fill="#58a6ff" opacity="0.04"/>
<g transform="translate(84 60) scale(0.315) translate(-42 -44)">
<path fill="#3fb950" fill-rule="evenodd" d="M42 44h34v152H54l-12-12zM76 44h58v34H76zM76 103h22v34H76zM76 162h58v34H76zM150 44h22l12 12v8h-34zM150 86h34v110h-34z"/>
<path fill="#56d364" fill-rule="evenodd" d="M116 103h68v34h-68zM76 162h58v34H76z"/>
</g>
