<text x="124" y="597" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="20" font-weight="650" text-anchor="start">不是让 AI 直连数据库；最终权限和业务规则仍由你的系统判断。</text>
