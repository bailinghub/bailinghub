<text x="330" y="94" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="750" text-anchor="start">AGENT-TO-BUSINESS</text>
<text x="80" y="188" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="850" text-anchor="start">让 Agent 通过对话</text>
<text x="80" y="258" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="58" font-weight="850" text-anchor="start">操作你的业务后台</text>
<text x="80" y="310" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="25" font-weight="650" text-anchor="start">商城 · SaaS · CRM · ERP｜权限、审批与审计仍在你手里</text>
<text x="80" y="348" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="18" font-weight="500" text-anchor="start">Connect natural-language agents to existing business systems—without bypassing authorization.</text>
<rect x="80" y="414" width="230" height="58" rx="29" fill="#1c242d" stroke="#30363d" stroke-width="2"/>
<text x="195" y="452" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="750" text-anchor="middle">自然语言目标</text>
