<text x="575" y="424" fill="#56d364" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="30" font-weight="850" text-anchor="middle">BailingHub</text>
<text x="575" y="462" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="21" font-weight="700" text-anchor="middle">身份 · 能力 · 审批 · 审计</text>
<text x="575" y="489" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="500" text-anchor="middle">Identity · capability · approval · audit</text>
