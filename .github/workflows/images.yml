name: Images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Image tag to publish. Defaults to package.json version.
        required: false
        type: string
      source_ref:
        description: Git ref to build. Defaults to the ref that started the workflow.
        required: false
        type: string
      push_latest:
        description: Also update latest tags.
        required: false
        default: true
        type: boolean
      mirror_acr_to_ghcr:
        description: Copy existing ACR application images to GHCR without rebuilding.
        required: false
        default: false
        type: boolean
  push:
    tags:
      - 'v*'

permissions: {}

env:
  ACR_REGISTRY: crpi-xm97pbcjrmf5in3s.cn-shanghai.personal.cr.aliyuncs.com
  ACR_NAMESPACE: bailinghub
  GHCR_REGISTRY: ghcr.io
  GHCR_NAMESPACE: bailinghub
  MYSQL_IMAGE_NAME: bailing-mysql
  MYSQL_TAG: '8.4'

jobs:
  publish:
    name: publish application images
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.mirror_acr_to_ghcr }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Verify release consistency
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || '' }}
        run: |
          set -euo pipefail
          expected="$REQUESTED_TAG"
          if [ -z "$expected" ] && [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            expected="${GITHUB_REF_NAME}"
          fi
          if [ -z "$expected" ]; then
            expected="$(node -p "require('./package.json').version")"
          fi
          npm run release:consistency -- --expected "$expected"

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Resolve image tag
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || '' }}
          REQUESTED_LATEST: ${{ github.event.inputs.push_latest || '' }}
        run: |
          set -euo pipefail
          requested_tag="$REQUESTED_TAG"
          requested_latest="$REQUESTED_LATEST"
          if [ -n "$requested_tag" ]; then
            tag="$requested_tag"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" == v* ]]; then
            tag="${GITHUB_REF_NAME}"
          else
            tag="$(node -p "require('./package.json').version")"
          fi
          policy_output="$(node scripts/image-release-policy.mjs \
            --tag "$tag" \
            --requested-latest "$requested_latest")"
          printf '%s\n' "$policy_output" >> "$GITHUB_OUTPUT"
          tag="$(printf '%s\n' "$policy_output" | sed -n 's/^tag=//p')"
          latest="$(printf '%s\n' "$policy_output" | sed -n 's/^push_latest=//p')"
          if [ -z "$tag" ] || { [ "$latest" != "true" ] && [ "$latest" != "false" ]; }; then
            echo 'image release policy returned incomplete output' >&2
            exit 1
          fi
          echo "source_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push bailinghub
        id: core_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          build-args: |
            NODE_IMAGE=node:22-bookworm-slim
          tags: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/bailinghub:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=BailingHub Agent control plane

      - name: Build and push bailing-demo-business
        id: demo_build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: ./demo/business
          push: true
          platforms: linux/amd64
          build-args: |
            NODE_IMAGE=node:22-bookworm-slim
          tags: ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_NAMESPACE }}/bailing-demo-business:${{ steps.meta.outputs.tag }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ steps.meta.outputs.source_sha }}
            org.opencontainers.image.version=${{ steps.meta.outputs.tag }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.description=BailingHub demo business system

      - name: Load the mirror script for a separately selected source revision
        if: github.event_name == 'workflow_dispatch' && inputs.source_ref != ''
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: mirror-tools
          sparse-checkout: scripts/copy-acr-platform-image.sh
          sparse-checkout-cone-mode: false

      - name: Copy released application images to Aliyun ACR
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          MIRROR_ROOT: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref != '' && 'mirror-tools' || '.' }}
          CORE_DIGEST: ${{ steps.core_build.outputs.digest }}
          DEMO_DIGEST: ${{ steps.demo_build.outputs.digest }}
          RELEASE_SHA: ${{ steps.meta.outputs.source_sha }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          PUSH_LATEST: ${{ steps.meta.outputs.push_latest }}
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y skopeo
          fi
          for attempt in 1 2 3 4; do
            if printf '%s' "$ACR_PASSWORD" | timeout 45s docker login \
              --username "$ACR_USERNAME" --password-stdin "$ACR_REGISTRY"; then break; fi
            if [[ "$attempt" == 4 ]]; then exit 1; fi
            sleep $((15 * attempt))
          done

          targets=("$RELEASE_TAG")
          if [[ "$PUSH_LATEST" == "true" ]]; then targets+=(latest); fi
          for target_tag in "${targets[@]}"; do
            for image in bailinghub bailing-demo-business; do
              digest="$CORE_DIGEST"
              if [[ "$image" == "bailing-demo-business" ]]; then digest="$DEMO_DIGEST"; fi
              timeout 480s bash "$MIRROR_ROOT/scripts/copy-acr-platform-image.sh" \
                "$GHCR_REGISTRY/$GHCR_NAMESPACE/$image" "$digest" \
                "$ACR_REGISTRY/$ACR_NAMESPACE/$image" "$target_tag" "$RELEASE_SHA" "$RELEASE_TAG"
            done
          done

      - name: Promote GHCR latest after both ACR mirrors are verified
        if: steps.meta.outputs.push_latest == 'true'
        shell: bash
        env:
          CORE_DIGEST: ${{ steps.core_build.outputs.digest }}
          DEMO_DIGEST: ${{ steps.demo_build.outputs.digest }}
        run: |
          set -euo pipefail
          for image in bailinghub bailing-demo-business; do
            digest="$CORE_DIGEST"
            if [[ "$image" == "bailing-demo-business" ]]; then digest="$DEMO_DIGEST"; fi
            repo="$GHCR_REGISTRY/$GHCR_NAMESPACE/$image"
            timeout 120s docker buildx imagetools create --prefer-index=false --tag "$repo:latest" "$repo@$digest"
            actual=$(skopeo inspect --retry-times 3 --raw "docker://$repo:latest" | sha256sum | cut -d ' ' -f 1)
            [[ "sha256:$actual" == "$digest" ]]
          done

  publish-mysql:
    name: sync mysql base image
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.mirror_acr_to_ghcr }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - name: Mirror MySQL
        shell: bash
        env:
          ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
        run: |
          set -euo pipefail

          retry() {
            local attempt=1
            local max_attempts=4
            local delay=15
            until "$@"; do
              if [ "$attempt" -ge "$max_attempts" ]; then
                return 1
              fi
              echo "attempt ${attempt}/${max_attempts} failed; retrying in ${delay}s"
              sleep "$delay"
              attempt=$((attempt + 1))
              delay=$((delay * 2))
            done
          }

          login_acr() {
            printf '%s' "$ACR_PASSWORD" | timeout 45s docker login \
              --username "$ACR_USERNAME" \
              --password-stdin \
              "$ACR_REGISTRY"
          }

          publish_mysql() {
            timeout 120s env \
            BAILING_PUSH_IMAGES=1 \
            BAILING_MYSQL_SOURCE_IMAGE=mysql:${MYSQL_TAG} \
            BAILING_MYSQL_IMAGE_TAG=${MYSQL_TAG} \
            BAILING_MYSQL_IMAGE_NAME=${MYSQL_IMAGE_NAME} \
            sh scripts/publish-mysql-image.sh
          }

          retry login_acr
          retry publish_mysql

  mirror-ghcr:
    name: mirror released images to GHCR
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mirror_acr_to_ghcr }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.source_ref || github.ref }}

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to Aliyun ACR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.ACR_REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve image tag
        id: meta
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event.inputs.tag || '' }}
          REQUESTED_LATEST: ${{ github.event.inputs.push_latest || '' }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [ -z "$tag" ]; then
            tag="$(node -p "require('./package.json').version")"
          fi
          node scripts/image-release-policy.mjs \
            --tag "$tag" \
            --requested-latest "$REQUESTED_LATEST" >> "$GITHUB_OUTPUT"

      - name: Load the recovery script from the workflow revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
          path: recovery-tools
          sparse-checkout: scripts/restore-ghcr-version.sh
          sparse-checkout-cone-mode: false

      - name: Restore missing versions and verify existing GHCR images
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          PUSH_LATEST: ${{ steps.meta.outputs.push_latest }}
        run: |
          set -euo pipefail
          if ! command -v skopeo >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y skopeo
          fi
          images=(bailinghub bailing-demo-business)
          digests=()
          for image in "${images[@]}"; do
            digest=$(timeout 480s bash recovery-tools/scripts/restore-ghcr-version.sh \
              "$ACR_REGISTRY/$ACR_NAMESPACE/$image" "$GHCR_REGISTRY/$GHCR_NAMESPACE/$image" "$RELEASE_TAG")
            digests+=("$digest")
          done
          if [[ "$PUSH_LATEST" == true ]]; then
            for i in "${!images[@]}"; do
              repo="$GHCR_REGISTRY/$GHCR_NAMESPACE/${images[$i]}"
              digest="${digests[$i]}"
              timeout 120s docker buildx imagetools create --prefer-index=false --tag "$repo:latest" "$repo@$digest"
              actual=$(skopeo inspect --retry-times 3 --raw "docker://$repo:latest" | sha256sum | cut -d ' ' -f 1)
              [[ "sha256:$actual" == "$digest" ]]
            done
          fi
