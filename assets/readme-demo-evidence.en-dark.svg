<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">SO-1001: request → approval → execution → trace</title>
<desc id="desc">The public BailingHub Docker demo uses deterministic order SO-1001 to reproduce a refund request through trusted identity, tool governance, business approval, approved execution, and trace evidence.</desc>
