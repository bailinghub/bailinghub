<circle cx="709" cy="730" r="20" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
<text x="709" y="736" fill="#116329" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" text-anchor="middle">3</text>
<text x="739" y="736" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start">Allowed capability</text>
<path d="M 931 730 H 961" fill="none" stroke="#1f883d" stroke-width="3" marker-end="url(#overview-arrow)"/>
<circle cx="996" cy="730" r="20" fill="#ffffff" stroke="#1f883d" stroke-width="2"/>
<text x="996" y="736" fill="#116329" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" text-anchor="middle">4</text>
<text x="1026" y="736" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start">Business authorization</text>
<path d="M 1218 730 H 1248" fill="none" stroke="#1f883d" stroke-width="3" marker-end="url(#overview-arrow)"/>
<circle cx="1283" cy="730" r="20" fill="#1f883d" stroke="#1f883d" stroke-width="2"/>
<text x="1283" y="736" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" text-anchor="middle">5</text>
<text x="1313" y="736" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start">Result &amp; trace</text>
<text x="800" y="770" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="500" text-anchor="middle">From one request to a real business result, every step remains verifiable</text>
<text x="800" y="854" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="650" text-anchor="middle">BailingHub controls what the agent can reach. Your system remains the final authority.</text>
