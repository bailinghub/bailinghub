<text x="1158" y="442" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" text-anchor="start">CRM</text>
<text x="1158" y="472" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" text-anchor="start">Customers · follow-ups</text>
<rect x="1320" y="407" width="160" height="92" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="1338" y="442" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="20" font-weight="800" text-anchor="start">ERP</text>
<text x="1338" y="472" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="500" text-anchor="start">Inventory · purchasing</text>
<rect x="1140" y="526" width="340" height="76" rx="12" fill="#dafbe1" stroke="#1f883d" stroke-width="2"/>
<text x="1310" y="558" fill="#116329" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="16" font-weight="800" text-anchor="middle">ACTION COMPLETE</text>
<text x="1310" y="584" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="500" text-anchor="middle">Write back to the system of record and keep a task trail</text>
