<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Turn a request into a verifiable business action</title>
<desc id="desc">A user states a goal in natural language. BailingHub applies trusted identity, capability scope, approval, and audit controls, while the existing system keeps final authority and performs the action.</desc>
<defs><marker id="overview-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f883d"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<path d="M 0 0 H 1600 V 7 H 0 Z" fill="#1f883d"/>
<text x="80" y="55" fill="#1f883d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="750" text-anchor="start">BAILINGHUB · BEYOND ANSWERS</text>
<text x="80" y="108" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="44" font-weight="800" text-anchor="start">Turn a request into a verifiable business action</text>
<text x="80" y="148" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="500" text-anchor="start">Keep your commerce, SaaS, CRM, or ERP—and never give an agent raw database access.</text>
<rect x="80" y="185" width="410" height="455" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="110" y="225" fill="#1f883d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="750" text-anchor="start">01 · STATE THE GOAL</text>
<rect x="110" y="255" width="350" height="315" rx="14" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<circle cx="132" cy="278" r="5" fill="#1f883d"/>
<text x="148" y="284" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650" text-anchor="start">Connected to the current business system</text>
<rect x="130" y="315" width="270" height="58" rx="15" fill="#eef2f5" stroke="#eef2f5" stroke-width="1"/>
<text x="150" y="351" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="500" text-anchor="start">What should I handle today?</text>
<rect x="160" y="400" width="270" height="104" rx="15" fill="#dafbe1" stroke="#1f883d" stroke-width="2"/>
<text x="180" y="439" fill="#116329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start">Find unshipped orders.</text>
<text x="180" y="470" fill="#116329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start">Create tickets for exceptions.</text>
<rect x="130" y="532" width="210" height="10" rx="5" fill="#eef2f5"/>
<text x="110" y="610" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" text-anchor="start">Natural-language request</text>
<path d="M 490 412 H 550" fill="none" stroke="#1f883d" stroke-width="4" marker-end="url(#overview-arrow)"/>
<rect x="565" y="185" width="470" height="455" rx="18" fill="#dafbe1" stroke="#1f883d" stroke-width="3"/>
<text x="595" y="225" fill="#116329" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="750" text-anchor="start">02 · BAILINGHUB</text>
<text x="595" y="265" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="800" text-anchor="start">Turn the goal into a governed action</text>
<rect x="595" y="294" width="410" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="611" y="311" width="30" height="30" rx="8" fill="#ddf4ff"/>
<text x="626" y="333" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" text-anchor="middle">1</text>
<text x="657" y="321" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="750" text-anchor="start">Trusted identity</text>
<text x="657" y="344" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" text-anchor="start">Who this action represents</text>
<rect x="595" y="372" width="410" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="611" y="389" width="30" height="30" rx="8" fill="#ddf4ff"/>
<text x="626" y="411" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" text-anchor="middle">2</text>
<text x="657" y="399" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="750" text-anchor="start">Capability scope</text>
<text x="657" y="422" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" text-anchor="start">Only connected actions</text>
<rect x="595" y="450" width="410" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="611" y="467" width="30" height="30" rx="8" fill="#fff8c5"/>
<text x="626" y="489" fill="#9a6700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" text-anchor="middle">3</text>
<text x="657" y="477" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="750" text-anchor="start">Risk &amp; approval</text>
<text x="657" y="500" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" text-anchor="start">Pause when a person must decide</text>
<rect x="595" y="528" width="410" height="64" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="611" y="545" width="30" height="30" rx="8" fill="#ddf4ff"/>
<text x="626" y="567" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800" text-anchor="middle">4</text>
<text x="657" y="555" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="750" text-anchor="start">Audit trail</text>
<text x="657" y="578" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" text-anchor="start">Conversation and execution evidence</text>
