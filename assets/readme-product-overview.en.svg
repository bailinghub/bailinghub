<rect x="1110" y="185" width="410" height="455" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="1140" y="225" fill="#1f883d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="750" text-anchor="start">03 · EXISTING SYSTEMS</text>
<text x="1140" y="265" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" font-weight="800" text-anchor="start">Your system performs the real action</text>
<rect x="1140" y="295" width="160" height="92" rx="12" fill="#ddf4ff" stroke="#d0d7de" stroke-width="2"/>
