<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
<title id="title">Three agent entry points, one business control plane</title>
<desc id="desc">Embedded web chat, local agents, and API automation share the same BailingHub identity, routing, tool, approval, and audit controls before reaching existing business systems.</desc>
<defs><marker id="entry-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#1f883d"/></marker></defs>
<rect width="1600" height="900" fill="#ffffff"/>
<path d="M 0 0 H 1600 V 7 H 0 Z" fill="#1f883d"/>
<text x="80" y="55" fill="#1f883d" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="750" text-anchor="start">BAILINGHUB · MANY ENTRY POINTS, ONE CAPABILITY LAYER</text>
<text x="80" y="108" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="43" font-weight="800" text-anchor="start">Three agent entry points, one business control plane</text>
<text x="80" y="148" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="19" font-weight="500" text-anchor="start">Start from different interfaces while keeping authorization, business rules, and execution in your system.</text>
<rect x="80" y="185" width="430" height="155" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<circle cx="128" cy="233" r="25" fill="#1f883d"/>
<path d="M 114 224 h 28 v 17 h -13 l -8 7 v -7 h -7 z" fill="none" stroke="#ffffff" stroke-width="3" stroke-linejoin="round"/>
<text x="170" y="228" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="800" text-anchor="start">Embedded web chat</text>
<text x="170" y="262" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650" text-anchor="start">Add it to commerce, SaaS, or internal admin UIs</text>
<text x="110" y="308" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" text-anchor="start">Users state goals without leaving the page</text>
<rect x="80" y="390" width="430" height="155" rx="16" fill="#ddf4ff" stroke="#0969da" stroke-width="2"/>
<circle cx="128" cy="438" r="25" fill="#0969da"/>
<rect x="113" y="424" width="30" height="21" rx="3" fill="none" stroke="#ffffff" stroke-width="3"/><path d="M 123 451 h 10 M 128 445 v 6" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>
<text x="170" y="433" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="800" text-anchor="start">Local agent</text>
<text x="170" y="467" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650" text-anchor="start">Authorize in browser; use a desktop agent</text>
<text x="110" y="513" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" text-anchor="start">Explicitly select an authorized business identity</text>
<rect x="80" y="595" width="430" height="155" rx="16" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<circle cx="128" cy="643" r="25" fill="#1f883d"/>
<text x="128" y="650" fill="#ffffff" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800" text-anchor="middle">&lt;/&gt;</text>
<text x="170" y="638" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21" font-weight="800" text-anchor="start">API / automation</text>
<text x="170" y="672" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="650" text-anchor="start">Backend events, schedules, or workflows</text>
<text x="110" y="718" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" text-anchor="start">Connect existing automation through a stable API</text>
<path d="M 510 262 C 560 262 560 330 610 330" fill="none" stroke="#1f883d" stroke-width="4" marker-end="url(#entry-arrow)"/>
<path d="M 510 467 C 560 467 560 450 610 450" fill="none" stroke="#1f883d" stroke-width="4" marker-end="url(#entry-arrow)"/>
<path d="M 510 672 C 560 672 560 570 610 570" fill="none" stroke="#1f883d" stroke-width="4" marker-end="url(#entry-arrow)"/>
<rect x="610" y="235" width="440" height="430" rx="20" fill="#dafbe1" stroke="#1f883d" stroke-width="3"/>
<text x="640" y="282" fill="#116329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="31" font-weight="850" text-anchor="start">BailingHub</text>
<text x="640" y="316" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="500" text-anchor="start">One Agent-to-Business control plane</text>
<rect x="640" y="355" width="170" height="96" rx="13" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="658" y="373" width="28" height="28" rx="7" fill="#ddf4ff"/>
<text x="672" y="393" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800" text-anchor="middle">1</text>
<text x="658" y="429" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="750" text-anchor="start">Identity binding</text>
<rect x="830" y="355" width="170" height="96" rx="13" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="848" y="373" width="28" height="28" rx="7" fill="#ddf4ff"/>
<text x="862" y="393" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800" text-anchor="middle">2</text>
<text x="848" y="429" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="750" text-anchor="start">Route &amp; context</text>
<rect x="640" y="480" width="170" height="96" rx="13" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="658" y="498" width="28" height="28" rx="7" fill="#ddf4ff"/>
<text x="672" y="518" fill="#0969da" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800" text-anchor="middle">3</text>
<text x="658" y="554" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="750" text-anchor="start">Tool scope</text>
<rect x="830" y="480" width="170" height="96" rx="13" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<rect x="848" y="498" width="28" height="28" rx="7" fill="#fff8c5"/>
<text x="862" y="518" fill="#9a6700" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800" text-anchor="middle">4</text>
<text x="848" y="554" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="750" text-anchor="start">Approval &amp; audit</text>
<text x="830" y="625" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" text-anchor="middle">Maintain routes, knowledge, tools, and records once</text>
<path d="M 1050 450 H 1145" fill="none" stroke="#1f883d" stroke-width="4" marker-end="url(#entry-arrow)"/>
<rect x="1160" y="235" width="360" height="430" rx="18" fill="#f6f8fa" stroke="#d0d7de" stroke-width="2"/>
<text x="1190" y="282" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="25" font-weight="800" text-anchor="start">Existing systems</text>
<text x="1190" y="316" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" font-weight="500" text-anchor="start">Your data, accounts, and permissions stay yours</text>
<rect x="1190" y="360" width="130" height="56" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="1255" y="396" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="750" text-anchor="middle">Commerce</text>
<rect x="1340" y="360" width="130" height="56" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="1405" y="396" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="750" text-anchor="middle">SaaS</text>
<rect x="1190" y="438" width="130" height="56" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="1255" y="474" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="750" text-anchor="middle">CRM</text>
<rect x="1340" y="438" width="130" height="56" rx="12" fill="#ffffff" stroke="#d0d7de" stroke-width="2"/>
<text x="1405" y="474" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="750" text-anchor="middle">ERP</text>
<rect x="1190" y="516" width="280" height="56" rx="12" fill="#dafbe1" stroke="#1f883d" stroke-width="2"/>
<text x="1330" y="552" fill="#116329" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="750" text-anchor="middle">Internal</text>
<text x="1340" y="620" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" font-weight="650" text-anchor="middle">Final authority · real execution · system data</text>
<rect x="610" y="705" width="910" height="74" rx="14" fill="#eef2f5" stroke="#d0d7de" stroke-width="2"/>
<circle cx="650" cy="742" r="19" fill="#1f883d"/>
<path d="M 640 742 l 7 7 14 -16" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<text x="690" y="749" fill="#111820" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" text-anchor="start">Shared capabilities · shared authorization boundary · shared execution record</text>
<text x="800" y="854" fill="#667085" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="16" font-weight="650" text-anchor="middle">Entry points may change. Models cannot invent business identity or bypass business authorization.</text>
</svg>
